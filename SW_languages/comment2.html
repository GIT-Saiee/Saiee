<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Comments</title>
</head>

<body>
    <h2>Comments</h2>
    <ul id="commentList" style="list-style: none; padding: 0;"></ul>
    <input type="text" id="author-input" placeholder="Your Name" class="comment-author">
    <textarea id="commentInput" placeholder="Write a comment..."></textarea>
    <button onclick="submitComment()">Submit</button>

    <script>
        const repo = 'GIT-Saiee/Saiee'; // Change this
        const issueNumber = 1; // Change to your issue number
        const token = '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'; // Required for posting comments (optional for reading)

        async function loadComments() {
            const response = await fetch(`https://api.github.com/repos/${repo}/issues/${issueNumber}/comments`);
            const comments = await response.json();



            if (comments.length === 0) {
                console.log("No comments found.");
                return;
            }

          //  let cleanedComments = [];
          let processedComments = [];
            for (let i = 0; i < comments.length; i++) {
                let commentText = comments[i].body; // Original comment text
             //   cleanedComments.push(commentText);  // Add to new array without username

                let parts = commentText.split(/:(.*)/s); // Splits into [str1, str2] keeping rest intact
                let heading = parts[0].trim();  // str1 as heading
                let body = (parts[1] || "").trim(); // str2 as body (if exists)
               
                processedComments.push(`<li><strong><span style="text-transform:uppercase">${heading}</span>:</strong><br> ${body}<br><br></li>`);
            }   


             // Display processed comments
             document.getElementById('commentList').innerHTML = processedComments.join('');

            // Process the last comment separately
            const lastComment = processedComments[processedComments.length - 1];
            document.getElementById('lastComment').innerHTML = `Last comment: ${lastComment}`;
            // Display cleaned comments (without usernames)
          //  document.getElementById('commentList').innerHTML = cleanedComments.map(c => `<li>${c}</li>`).join('');

            // Process the last comment (without username)
          //  const lastComment = cleanedComments[cleanedComments.length - 1];
          //  document.getElementById('lastComment').innerText = `Last comment: ${lastComment}`;
        }


        async function submitComment() {
            const author = document.getElementById('author-input').value;
            const comment = document.getElementById('commentInput').value;
            if (!comment) return alert("Comment cannot be empty");
            if (author && comment) {
                await fetch(`https://api.github.com/repos/${repo}/issues/${issueNumber}/comments`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ body: author + ":" + comment })
                });

                document.getElementById('commentInput').value = '';
                document.getElementById('author-Input').value = ''
                loadComments();
            }
            else {
                alert('Please enter your name and comment.');
            }
        }

        window.onload = loadComments;

</script>
