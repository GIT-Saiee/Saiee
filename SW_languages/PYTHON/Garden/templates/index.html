<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit List</title>   
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>
    <div >
        <img src="{{url_for('static', filename='images/transparent-fruit-24.png')}}" alt="Fruits">
         <p class="logo-text">Fruit Garden Care</p>
    </div>
   
       
    <div id ="add_item">
        <form action="/add_fruits" method="POST">
                 {% for item in all_fruits %}
                    <input type="checkbox" name="select_fruits" value="{{ item }}" id=" {{ item }}">
                    <label for="{{ item }}"name ="{{item}}">{{ item }}</label><br>
                {% endfor %}
            <input type="submit" value="Select Fruits" id = 'add_btn'>
        </form>
  
</body>
</html>
