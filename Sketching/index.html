<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Z-Index Effect</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../main.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
</head>
<body>
  <div class="navbar">
    <div id="nav-placeholder"></div>
  </div>

  <script>
    $.get("../navigation.html", function(data){
      $("#nav-placeholder").replaceWith(data);
    });
  </script> 

  <div class="image-container">
    <img src="Images/Gitacharya.jpg" class="floating-image" alt="Image 1">
    <img src="Images/Krishna.jpg" class="floating-image" alt="Image 2">
    <img src="Images/MomAndSon.jpg" class="floating-image" alt="Image 3">
    <img src="Images/RamaAndSita.jpg" class="floating-image" alt="Image 4">
    <img src="Images/SmallKrishna.jpg" class="floating-image" alt="Image 5">
    <img src="Images/Gayatri_1.png" class="floating-image" alt="Image 6">
    <img src="Images/Gayatri_2.png" class="floating-image" alt="Image 7">
    <img src="Images/Datta.jpg" class="floating-image" alt="Image 8">
    <img src="Images/3monkeys.JPG" class="floating-image" alt="Image 9">
  </div>


  <script src="index.js"></script>

</body>
</html>
