<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <div class="container">
            <div class="flip-book" id="demoBookExample1">
            </div>
            
        </div>
        <div class="container">
            <div class="flip-book" id="demoBookExample2">
            </div>
            
        </div>
         <button id="printBookButton">
          <img src="images/printer-icon.png" alt="Print" style="width: 24px; vertical-align: middle;">
          Print Selected Pages</button>

        <div id="printable-content" style="display:none;">
        </div>
         <hr>
        <iframe id="commentIframe" src="../comments.html" width="100%" style="border: none; overflow: hidden;" scrolling="no"></iframe>
    </div>
        
        
        
</div>
<script>
  function resizeIframe() {
    var iframe = document.getElementById("commentIframe");
    if (iframe) {
      iframe.style.height = iframe.contentWindow.document.body.scrollHeight + "px";
    }
  }

  // Resize when iframe loads
  document.getElementById("commentIframe").onload = function() {
    resizeIframe();
  };

  window.onload = function() {
    window.parent.postMessage(
      { type: "resize", height: document.body.scrollHeight },
      "*"
    );
  }


  window.addEventListener("message", function(event) {
    if (event.data.type === "resize") {
      document.getElementById("commentIframe").style.height = event.data.height + "px";
    }
  }, false);

</script>
    <script type="module" src="ratham.js"></script>
    <script type="module" src="print.js"></script>
</body>
</html>
