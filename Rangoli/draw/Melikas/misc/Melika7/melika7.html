<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melika Muggulu</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <link rel="stylesheet" href="../../style1.css">
    <link href="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/src/Style/stPageFlip.min.css" rel="stylesheet"> 
</head>

<body>
    <div class="main-container">
    <div class="container">
        <h1 align="center"> Click/Flip the book to see instructions</h1>
        <div class="flip-book" id="demoBookExample2">
        </div>
        <hr>
        <iframe id="commentIframe" src="../../comments.html" width="100%" style="border: none; overflow: hidden;" scrolling="no"></iframe>
    </div>
</div>
<script>
  function resizeIframe() {
    var iframe = document.getElementById("commentIframe");
    if (iframe) {
      iframe.style.height = iframe.contentWindow.document.body.scrollHeight + "px";
    }
  }

  // Resize when iframe loads
  document.getElementById("commentIframe").onload = function() {
    resizeIframe();
  };

  window.onload = function() {
    window.parent.postMessage(
      { type: "resize", height: document.body.scrollHeight },
      "*"
    );
  }


  window.addEventListener("message", function(event) {
    if (event.data.type === "resize") {
      document.getElementById("commentIframe").style.height = event.data.height + "px";
    }
  }, false);

  
</script>
</body>
<script  type="module" src="melika7.js"></script>
</html>
