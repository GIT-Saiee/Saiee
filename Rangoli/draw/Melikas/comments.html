
    <h2 color="#dc3545">Comments</h2>

    <div class="comment-section">

       <div class="grid-item2"><textarea id="commentInput" placeholder="Write a comment..." class="input-text"></textarea></div>

    </div>

            const comments = await response.json();



            if (comments.length === 0) {
                console.log("No comments found.");
                return;
            }

          //  let cleanedComments = [];
          let processedComments = [];

             // Display processed comments
             document.getElementById('commentList').innerHTML = processedComments.join('');

            if (lastComment != null){
                 document.getElementById('lastComment').innerHTML = `Last comment: ${lastComment}`;
            }
            // Display cleaned comments (without usernames)
          //  document.getElementById('commentList').innerHTML = cleanedComments.map(c => `<li>${c}</li>`).join('');

            // Process the last comment (without username)
          //  const lastComment = cleanedComments[cleanedComments.length - 1];
          //  document.getElementById('lastComment').innerText = `Last comment: ${lastComment}`;
        }


        async function submitComment() {
            const author = document.getElementById('author-input').value;
            const comment = document.getElementById('commentInput').value;
            if (!comment) return alert("Comment cannot be empty");
            if (author && comment) {
                await fetch(`https://api.github.com/repos/${repo}/issues/${issueNumber}/comments`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ body: author + ":" + comment })
                });

                document.getElementById('commentInput').value = '';
                document.getElementById('author-input').value = '';
                loadComments();
            }
            else {
                alert('Please enter your name and comment.');
            }
        }

        window.onload = loadComments;

</script>
